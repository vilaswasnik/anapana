<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Bell Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1f2937;
            color: white;
        }
        .test-button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
        }
        .test-button:hover {
            background: #5855eb;
        }
    </style>
</head>
<body>
    <h1>🔔 Visual Bell System Test</h1>
    <p>Click the buttons below to test the visual bell animations:</p>
    
    <button class="test-button" onclick="testStartBell()">🔔 Test Start Bell</button>
    <button class="test-button" onclick="testEndBell()">✨ Test End Bell</button>
    <button class="test-button" onclick="testIntervalBell()">🎋 Test Interval Bell</button>
    
    <div id="status" style="margin-top: 20px; padding: 10px; background: #374151; border-radius: 5px;">
        <p>Status: Ready to test</p>
        <p>If you see full-screen animations with colors and ripples, the visual system is working!</p>
    </div>

    <script src="visual-bells.js"></script>
    <script>
        let visualBells;
        
        // Initialize visual bells system
        try {
            visualBells = new VisualBellSystem();
            document.getElementById('status').innerHTML = `
                <p style="color: #10b981;">✅ Visual Bell System initialized successfully!</p>
                <p>Click the buttons above to see the animations.</p>
            `;
        } catch (error) {
            document.getElementById('status').innerHTML = `
                <p style="color: #ef4444;">❌ Error initializing Visual Bell System:</p>
                <p style="color: #ef4444;">${error.message}</p>
            `;
        }
        
        function testStartBell() {
            if (visualBells) {
                visualBells.showBell('start');
                updateStatus('🔔 Start bell animation triggered!');
            }
        }
        
        function testEndBell() {
            if (visualBells) {
                visualBells.showBell('end');
                updateStatus('✨ End bell animation triggered!');
            }
        }
        
        function testIntervalBell() {
            if (visualBells) {
                visualBells.showBell('interval');
                updateStatus('🎋 Interval bell animation triggered!');
            }
        }
        
        function updateStatus(message) {
            const status = document.getElementById('status');
            status.innerHTML = `
                <p style="color: #10b981;">✅ Visual Bell System working!</p>
                <p>${message}</p>
                <p><em>You should see a full-screen overlay with animations!</em></p>
            `;
        }
    </script>
</body>
</html>
